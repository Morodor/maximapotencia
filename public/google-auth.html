<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticación Google - Máxima Potencia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 1rem;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      color: white;
      margin: 0 auto 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
    }
    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(239, 68, 68, 0.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      border-radius: 0.875rem;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-google {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
    }
    .btn-google:hover { background: #334155; }
    .btn-return {
      background: #ef4444;
      color: white;
      margin-top: 1rem;
    }
    .btn-return:hover { background: #dc2626; }
    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      margin-top: 1rem;
      text-align: left;
      display: none;
    }
  </style>

  <!-- Firebase App & Auth SDK (v10 modular via compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">MP</div>
    <h2 id="title">Acceso Oficial con Google</h2>
    <p id="desc">Conectando con tu cuenta de Google de forma segura...</p>

    <div id="spinner" class="spinner"></div>

    <div id="actionArea" style="display: none;">
      <a id="returnBtn" href="#" class="btn btn-return">
        Abrir Máxima Potencia Ahora
      </a>
    </div>

    <button id="manualLoginBtn" class="btn btn-google" style="display: none;" onclick="startLogin()">
      Reintentar con Google
    </button>

    <div id="errorBox" class="error-box"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6m3ed6Wt1bCpP0tcyPf_YklreiEqB4OE",
      authDomain: "maximapotencia-bd31e.firebaseapp.com",
      projectId: "maximapotencia-bd31e",
      storageBucket: "maximapotencia-bd31e.firebasestorage.app",
      messagingSenderId: "629587208455",
      appId: "1:629587208455:web:22610831920d871f5bfda2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    function handleSuccess(user, idToken, accessToken) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = '¡Inicio de Sesión Exitoso!';
      document.getElementById('desc').textContent = 'Bienvenido ' + (user.displayName || user.email) + '. Regresando a Máxima Potencia...';
      
      let callbackUrl = 'maximapotencia://auth-callback?email=' + encodeURIComponent(user.email || '') + 
                        '&name=' + encodeURIComponent(user.displayName || '');
      if (idToken) callbackUrl += '&idToken=' + encodeURIComponent(idToken);
      if (accessToken) callbackUrl += '&accessToken=' + encodeURIComponent(accessToken);

      document.getElementById('returnBtn').href = callbackUrl;
      document.getElementById('actionArea').style.display = 'block';

      // Intento de redirección automática hacia la app nativa
      setTimeout(() => {
        window.location.href = callbackUrl;
      }, 400);
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Atención';
      document.getElementById('desc').textContent = 'No se pudo completar el acceso con Google.';
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
      document.getElementById('manualLoginBtn').style.display = 'inline-flex';
    }

    // Comprobar si ya viene de una redirección
    auth.getRedirectResult()
      .then((result) => {
        if (result && result.user) {
          const idToken = result.credential ? result.credential.idToken : null;
          const accessToken = result.credential ? result.credential.accessToken : null;
          if (idToken || accessToken) {
            handleSuccess(result.user, idToken, accessToken);
          } else {
            result.user.getIdToken().then(t => handleSuccess(result.user, t, null));
          }
        } else {
          // Si no hay resultado pendiente, iniciar el flujo
          startLogin();
        }
      })
      .catch((err) => {
        showError(err.message || 'Error al procesar redirección de Google.');
      });

    function startLogin() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('manualLoginBtn').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';

      // Usar redirección directa en navegador móvil para no depender de popups bloqueados
      auth.signInWithRedirect(provider).catch((err) => {
        showError(err.message || 'Error al iniciar redirección con Google.');
      });
    }
  </script>
</body>
</html>
